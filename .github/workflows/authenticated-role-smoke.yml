name: Authenticated Role Smoke

on:
  push:
    branches: [full-smoke-test]
    paths:
      - '.github/workflows/authenticated-role-smoke.yml'

jobs:
  auth:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BASE_URL: https://jansamadhan-ai-prototype-irzt.onrender.com
      ADMIN_TEST_USERNAME: ${{ secrets.ADMIN_TEST_USERNAME }}
      ADMIN_TEST_PASSWORD: ${{ secrets.ADMIN_TEST_PASSWORD }}
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Test role access and persistent UI
        run: |
          python - <<'PY'
          import os,sys
          from playwright.sync_api import sync_playwright, TimeoutError as PlaywrightTimeoutError

          B=os.environ['BASE_URL']
          admin_user=os.environ.get('ADMIN_TEST_USERNAME','').strip()
          admin_password=os.environ.get('ADMIN_TEST_PASSWORD','')
          bad=[]

          def ck(n,v,d=''):
              print(('PASS' if v else 'FAIL')+' | '+n+((' | '+str(d)) if d else ''))
              if not v: bad.append((n,d))

          def set_session(page, session):
              page.evaluate("s => localStorage.setItem('jansamadhan_session_v2', JSON.stringify(s))", session)
              page.reload(wait_until='domcontentloaded',timeout=60000)
              page.wait_for_selector('#dashView',state='visible',timeout=15000)

          with sync_playwright() as p:
              b=p.chromium.launch(headless=True)
              page=b.new_page(viewport={'width':1366,'height':900})
              errs=[]
              page.on('pageerror',lambda e:errs.append(str(e)))
              page.goto(B,wait_until='domcontentloaded',timeout=60000)
              page.wait_for_timeout(3000)

              # Admin login surface must select only the administrator role.
              page.get_by_role('button',name='Admin Panel',exact=True).click()
              page.wait_for_selector('#loginDialog[open]',timeout=10000)
              page.wait_for_function("() => { const d=document.querySelector('#loginDialog'); const a=d&&d.querySelector('[data-role=\"admin\"]'); const ps=d?[...d.querySelectorAll('[data-role=\"student\"],[data-role=\"university\"],[data-role=\"industry\"]')]:[]; return !!a && getComputedStyle(a).display!=='none' && ps.length===3 && ps.every(x=>getComputedStyle(x).display==='none'); }")
              ck('Admin login mode selected',page.locator('#loginDialog [data-role="admin"]').is_visible())

              # Real admin credentials are tested only when repository secrets are configured.
              # This keeps credentials out of source and prevents stale hard-coded passwords.
              if admin_user and admin_password:
                  page.fill('#username',admin_user)
                  page.fill('#password',admin_password)
                  page.locator('#loginForm button[type="submit"]').click()
                  try:
                      page.wait_for_selector('#dashView',state='visible',timeout=15000)
                      ck('Admin credential login',page.locator('#sessionRole').inner_text().strip().lower()=='admin')
                      page.locator('#logout').click()
                      page.wait_for_selector('#authView',state='visible',timeout=10000)
                  except PlaywrightTimeoutError:
                      err=page.locator('#loginError').inner_text().strip()
                      ck('Admin credential login',False,err or 'dashboard did not open')
                      if page.locator('#loginDialog').evaluate('(d)=>d.open'):
                          page.locator('[data-close="loginDialog"]').click()
              else:
                  print('SKIP | Admin credential login | configure ADMIN_TEST_USERNAME and ADMIN_TEST_PASSWORD secrets to enable it')
                  page.locator('[data-close="loginDialog"]').click()

              # Dashboard smoke uses a test-owned session contract, not a password in CI source.
              set_session(page,{'role':'admin','name':'Smoke Test Administrator','email':''})
              ck('Admin dashboard session',page.locator('#sessionRole').inner_text().strip().lower()=='admin')
              txt=page.locator('#content').inner_text()
              ck('Admin dashboard has both demo cases','JS-1001' in txt and 'JS-1002' in txt)
              ck('Admin chatbot persists',page.locator('#citizenChatbot').is_visible())
              ck('Admin clock persists',page.locator('#js-live-clock').is_visible())
              page.reload(wait_until='domcontentloaded',timeout=60000)
              page.wait_for_timeout(1800)
              ck('Admin session survives reload',page.locator('#dashView').is_visible() and page.locator('#sessionRole').inner_text().strip().lower()=='admin')
              page.locator('#logout').click()
              page.wait_for_selector('#authView',state='visible',timeout=10000)

              # Partner login surface remains separate from administrator access.
              page.get_by_role('button',name='Partner Login',exact=True).click()
              page.wait_for_selector('#loginDialog[open]',timeout=10000)
              page.wait_for_function("() => { const d=document.querySelector('#loginDialog'); const a=d&&d.querySelector('[data-role=\"admin\"]'); const ps=d?[...d.querySelectorAll('[data-role=\"student\"],[data-role=\"university\"],[data-role=\"industry\"]')]:[]; return !!a && getComputedStyle(a).display==='none' && ps.length===3 && ps.every(x=>getComputedStyle(x).display!=='none'); }")
              ck('Admin hidden in partner mode',not page.locator('#loginDialog [data-role="admin"]').is_visible())
              ck('Student role visible',page.locator('#loginDialog [data-role="student"]').is_visible())
              page.locator('[data-close="loginDialog"]').click()

              set_session(page,{'role':'student','name':'Aditi','accountId':'USR-2001'})
              ck('Student dashboard session',page.locator('#sessionRole').inner_text().strip().lower()=='student')
              ck('Student sees assigned JS-1001','JS-1001' in page.locator('#content').inner_text())
              ck('Student chatbot persists',page.locator('#citizenChatbot').is_visible())
              page.locator('#logout').click()
              page.wait_for_selector('#authView',state='visible',timeout=10000)

              ck('No JS exceptions during role test',not errs,errs[:5])
              b.close()

          if bad:
              print('FAILED',bad)
              sys.exit(1)
          PY
