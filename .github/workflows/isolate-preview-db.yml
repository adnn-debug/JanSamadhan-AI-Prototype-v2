name: Prepare official prototype release

on:
  push:
    branches:
      - official-prototype-release
    paths:
      - .github/workflows/isolate-preview-db.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: official-prototype-release

      - name: Convert preview layer to official production layer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          src = Path('static/branch-db-namespace.js')
          dst = Path('static/official-prototype-v1.js')
          text = src.read_text(encoding='utf-8')
          text = text.replace('clean-public-dashboard: isolate preview data from the main demo', 'JanSamadhan official prototype data and UI layer')
          text = text.replace('clean_public_dashboard_v3__', 'official_prototype_v1__')
          text = text.replace('window.JanSamadhanPreviewNamespace=PREFIX;', 'window.JanSamadhanOfficialNamespace=PREFIX;')
          text = text.replace('Preview local-storage namespace unavailable', 'Official local-storage namespace unavailable')
          text = text.replace('Preview Firestore namespace failed', 'Official Firestore namespace failed')
          text = text.replace('clean-preview-ui-style', 'official-prototype-ui-style')
          dst.write_text(text, encoding='utf-8')
          src.unlink()

          app = Path('app.py')
          app_text = app.read_text(encoding='utf-8')
          app_text = app_text.replace('/static/branch-db-namespace.js', '/static/official-prototype-v1.js')
          app.write_text(app_text, encoding='utf-8')

          workflow = Path('.github/workflows/isolate-preview-db.yml')
          workflow.unlink()
          PY

      - name: Commit production-ready release
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare official prototype release"
          git push origin HEAD:official-prototype-release
